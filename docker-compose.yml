services:
  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.dockerfile
    container_name: nitrum-control-plane
    ports:
      - "8181:8181"
    networks:
      nitrum:
        # Static IP so the enclave can reach the control-plane by address,
        # not hostname. This mirrors VSock CID in a real enclave: no DNS needed
        # to reach the host side, avoiding the circular-resolver bootstrap problem.
        ipv4_address: 172.20.0.10
    environment:
      - RUST_LOG=info
      # Docker's embedded DNS — handles internal container names and forwards
      # unknown domains upstream. Available in every container at 127.0.0.11.
      - DNS_UPSTREAM=127.0.0.11:53

  enclave:
    build:
      context: .
      dockerfile: docker/enclave.dockerfile
    container_name: nitrum-enclave
    depends_on:
      - control-plane
    cap_add:
      - NET_ADMIN
    networks:
      - nitrum
    environment:
      - RUST_LOG=info
      - CONTROL_PLANE_HOST=172.20.0.10
      - CONTROL_PLANE_PORT=8181
      - CONTROL_PLANE_DNS_PORT=5354

networks:
  nitrum:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
