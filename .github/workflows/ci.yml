name: CI

on:
  pull_request:
  push:
    branches: [master, develop]
    tags: ["v*"]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: CHANGELOG
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify CHANGELOG entry for tag
        run: ./scripts/verify-changelog.sh "${{ github.ref_name }}"

  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Rust Lint (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Test
        run: cargo test --all-features

  nitrum-node:
    name: nitrum-node (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: ${{ matrix.target }}
      - name: Add target to pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nitrum-node-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build native bindings
        shell: bash
        run: npm run build -w nitrum-node -- --target ${{ matrix.target }}
      - name: Smoke test
        # Skip host/target mismatch (x86_64 macOS binary on arm64 runners).
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: npm test -w nitrum-node
      - uses: actions/upload-artifact@v4
        with:
          name: nitrum-node-${{ matrix.target }}
          path: packages/node/nitrum-node.*.node
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: nitrum-node-js
          path: |
            packages/node/index.js
            packages/node/index.d.ts
          if-no-files-found: error

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-bin: true
          cache-on-failure: true
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check
