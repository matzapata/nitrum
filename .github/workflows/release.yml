name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker-images:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR image prefix
        run: echo "GHCR_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/control-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane
          tags: |
            ${{ env.GHCR_PREFIX }}/control-plane:${{ github.ref_name }}
            ${{ env.GHCR_PREFIX }}/control-plane:latest

      - name: Build and push data-plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/data-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FEATURES=enclave
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=data-plane
          cache-to: type=gha,mode=max,scope=data-plane
          tags: |
            ${{ env.GHCR_PREFIX }}/data-plane:${{ github.ref_name }}
            ${{ env.GHCR_PREFIX }}/data-plane:latest

      - name: Build and push data-plane (local / pebble)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/data-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FEATURES=pebble
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=data-plane-local
          cache-to: type=gha,mode=max,scope=data-plane-local
          tags: |
            ${{ env.GHCR_PREFIX }}/data-plane:${{ github.ref_name }}-local
            ${{ env.GHCR_PREFIX }}/data-plane:latest-local

      - name: Build and push nitro-cli
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/cli/nitro-cli.dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=nitro-cli
          cache-to: type=gha,mode=max,scope=nitro-cli
          tags: |
            ${{ env.GHCR_PREFIX }}/nitro-cli:${{ github.ref_name }}
            ${{ env.GHCR_PREFIX }}/nitro-cli:latest

  cli-binaries:
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.100

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p cli

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          src="target/release/nitrum${{ matrix.ext }}"
          dest="dist/nitrum-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "$src" "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: nitrum-cli-${{ matrix.suffix }}
          path: dist/*

  publish-nitrum-node:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Idempotent: package.json may already match the tag (e.g. prep bump).
          npm pkg set "version=${VERSION}" -w nitrum-node

      - name: Download JS bindings
        uses: actions/download-artifact@v8
        with:
          name: nitrum-node-js
          path: packages/node

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          # Match platform builds only (e.g. nitrum-node-x86_64-unknown-linux-gnu), not nitrum-node-js.
          pattern: nitrum-node-*-*
          path: packages/node/artifacts
          merge-multiple: false

      - name: Create platform packages and collect artifacts
        working-directory: packages/node
        run: |
          npm run create-npm-dirs
          npm run artifacts
          # Guard: every configured target must have its .node binary.
          missing=0
          for dir in npm/*/; do
            if ! ls "$dir"/*.node >/dev/null 2>&1; then
              echo "Missing native binary in $dir"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish with incomplete platform packages"
            ls -R npm artifacts || true
            exit 1
          fi

      - name: Copy LICENSE into package
        run: cp LICENSE packages/node/LICENSE

      - name: Publish to npm
        working-directory: packages/node
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [cli-binaries, docker-images, publish-nitrum-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nitrum-cli-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
