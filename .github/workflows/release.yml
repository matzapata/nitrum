name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker-images:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR image prefix
        run: echo "GHCR_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/control-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane
          tags: |
            ${{ env.GHCR_PREFIX }}/control-plane:${{ github.ref_name }}
            ${{ env.GHCR_PREFIX }}/control-plane:latest

      - name: Build and push data-plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/data-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FEATURES=enclave
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=data-plane
          cache-to: type=gha,mode=max,scope=data-plane
          tags: |
            ${{ env.GHCR_PREFIX }}/data-plane:${{ github.ref_name }}
            ${{ env.GHCR_PREFIX }}/data-plane:latest

      - name: Build and push data-plane (local / pebble)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/data-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FEATURES=pebble
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=data-plane-dev
          cache-to: type=gha,mode=max,scope=data-plane-dev
          tags: |
            ${{ env.GHCR_PREFIX }}/data-plane:${{ github.ref_name }}-dev
            ${{ env.GHCR_PREFIX }}/data-plane:latest-dev

      - name: Build and push nitro-cli
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/cli/nitro-cli.dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=nitro-cli
          cache-to: type=gha,mode=max,scope=nitro-cli
          tags: |
            ${{ env.GHCR_PREFIX }}/nitro-cli:${{ github.ref_name }}
            ${{ env.GHCR_PREFIX }}/nitro-cli:latest

  cli-binaries:
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p cli

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          src="target/release/nitrum${{ matrix.ext }}"
          dest="dist/nitrum-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "$src" "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: nitrum-${{ matrix.suffix }}
          path: dist/*

  github-release:
    needs: [cli-binaries, docker-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nitrum-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
