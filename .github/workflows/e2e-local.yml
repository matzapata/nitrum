name: E2E Local

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-local:
    name: Local E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR image prefix
        run: echo "GHCR_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build data-plane (local / pebble)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/data-plane/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            FEATURES=pebble
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=data-plane-local
          cache-to: type=gha,mode=max,scope=data-plane-local
          tags: |
            ${{ env.GHCR_PREFIX }}/data-plane:${{ github.sha }}-local

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E local tests
        env:
          NITRUM_RUNTIME_DATA_PLANE_IMAGE: ${{ env.GHCR_PREFIX }}/data-plane:${{ github.sha }}
          ENCLAVE_URL: https://nitrum.localhost:443
          ENCLAVE_TLS_INSECURE: "1"
        run: |
          chmod +x ./tests/e2e/local.sh
          ./tests/e2e/local.sh
