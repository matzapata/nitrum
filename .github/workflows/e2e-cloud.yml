name: E2E Cloud

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region for deploy and tests
        type: string
        default: us-east-1
        required: true
  workflow_call:
    inputs:
      aws_region:
        description: AWS region for deploy and tests
        type: string
        default: us-east-1
        required: false

concurrency:
  group: e2e-cloud
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            file: crates/control-plane/Dockerfile
            cache_scope: control-plane
            build_args: |
              GIT_SHA=${{ github.sha }}
              VERSION=${{ github.sha }}
          - name: data-plane
            file: crates/data-plane/Dockerfile
            cache_scope: data-plane
            build_args: |
              FEATURES=enclave
              GIT_SHA=${{ github.sha }}
              VERSION=${{ github.sha }}
          - name: nitro-cli
            file: crates/cli/nitro-cli.dockerfile
            cache_scope: nitro-cli
            build_args: |
              GIT_SHA=${{ github.sha }}
              VERSION=${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR image prefix
        run: echo "GHCR_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          tags: |
            ${{ env.GHCR_PREFIX }}/${{ matrix.name }}:${{ github.sha }}

  e2e-cloud:
    name: AWS E2E Cloud
    needs: [build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v6

      - name: GHCR image prefix
        run: echo "GHCR_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run E2E cloud tests
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          NITRUM_RUNTIME_CONTROL_PLANE_IMAGE: ${{ env.GHCR_PREFIX }}/control-plane:${{ github.sha }}
          NITRUM_RUNTIME_DATA_PLANE_IMAGE: ${{ env.GHCR_PREFIX }}/data-plane:${{ github.sha }}
          NITRUM_RUNTIME_NITRO_CLI_IMAGE: ${{ env.GHCR_PREFIX }}/nitro-cli:${{ github.sha }}
        run: |
          chmod +x ./tests/e2e/cloud.sh
          ./tests/e2e/cloud.sh
