name: E2E Cloud

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region for deploy and tests
        type: string
        default: us-east-1
        required: true

concurrency:
  group: e2e-cloud
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  e2e-cloud:
    name: AWS E2E Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR image prefix
        run: echo "GHCR_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/control-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane
          tags: |
            ${{ env.GHCR_PREFIX }}/control-plane:${{ github.sha }}

      - name: Build and push data-plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/data-plane/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FEATURES=enclave
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=data-plane
          cache-to: type=gha,mode=max,scope=data-plane
          tags: |
            ${{ env.GHCR_PREFIX }}/data-plane:${{ github.sha }}

      - name: Build and push nitro-cli
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/cli/nitro-cli.dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=nitro-cli
          cache-to: type=gha,mode=max,scope=nitro-cli
          tags: |
            ${{ env.GHCR_PREFIX }}/nitro-cli:${{ github.sha }}

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Run E2E cloud tests
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          NITRUM_E2E_RUNTIME_CONTROL_PLANE: ${{ env.GHCR_PREFIX }}/control-plane:${{ github.sha }}
          NITRUM_E2E_RUNTIME_DATA_PLANE: ${{ env.GHCR_PREFIX }}/data-plane:${{ github.sha }}
          NITRUM_E2E_RUNTIME_NITRO_CLI: ${{ env.GHCR_PREFIX }}/nitro-cli:${{ github.sha }}
        run: |
          chmod +x ./tests/e2e/cloud.sh
          ./tests/e2e/cloud.sh
