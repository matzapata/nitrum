# Default template generated with `nitrum init`
# For details check https://github.com/matzapata/nitrum/blob/develop/crates/config/src/sections/

[project]
name = "nitrum-hello"
port = 8080
start_command = ["/app/hello"]

[runtime]
data_plane = "ghcr.io/matzapata/nitrum/data-plane:latest"
control_plane = "ghcr.io/matzapata/nitrum/control-plane:latest"
nitro_cli = "ghcr.io/matzapata/nitrum/nitro-cli:latest"

[health_check]
path = "/health"
port = 8080
interval = 10

[scaling]
desired_replicas = 1
max_replicas = 2
min_replicas = 1
num_cpus = 2
ram_size_mib = 4320
instance_type = "m6i.xlarge"

[cloud]
xray_tracing = false
log_retention_days = 7
safe_rolling = true

[tls_termination]
acme = false
domain = "nitrum.local"

[egress]
enabled = true
destinations = [
  "ipify\\.org$",
]
