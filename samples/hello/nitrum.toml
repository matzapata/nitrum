# Default template generated with `nitrum init`
# For details check https://github.com/matzapata/nitrum/blob/develop/crates/shared/src/config.rs

name = "nitrum-hello"

[service]
port = 8080

[health_check]
path = "/health"
port = 8080
interval = 10

[scaling]
desired_replicas = 1
max_replicas = 1
min_replicas = 1
num_cpus = 2
ram_size_mib = 4320

[tls_termination]
acme = false
domain = "nitrum.local"
