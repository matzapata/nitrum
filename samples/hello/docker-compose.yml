# Local development compose for the hello sample.
#
# Usage:
#   docker compose up            # start (previously built hello image)
#   docker compose down          # stop
#
# For domain nitrum.local (e.g. ACME cert), add to your host /etc/hosts:
#   127.0.0.1 nitrum.local
# Then you can use: curl -sk https://nitrum.local/...
#
# Test the enclave well-known endpoints:
#   curl -sk https://nitrum.local/.well-known/enclave/status
#   curl -sk https://nitrum.local/.well-known/enclave/attestation
#
# Test the user app through TLS ingress:
#   curl -sk https://nitrum.local/health
#
# Access the internal data-plane API directly (no TLS):
#   curl http://nitrum.local/attestation -d '{}'
#
# Test crypto (encrypt/decrypt via app; plaintext is UTF-8 string):
#   curl -sk https://nitrum.local/crypto -H "Content-Type: application/json" -d '{"plaintext":"hello"}'

configs:
  pebble-config:
    content: |
      {
        "pebble": {
          "listenAddress": "0.0.0.0:14000",
          "managementListenAddress": "0.0.0.0:15000",
          "certificate": "test/certs/localhost/cert.pem",
          "privateKey": "test/certs/localhost/key.pem",
          "httpPort": 5002,
          "tlsPort": 5001,
          "ocspResponderURL": "",
          "externalAccountBindingRequired": false,
          "retryAfter": { "authz": 1, "order": 1 },
          "profiles": {
            "default": {
              "description": "Short-lived certs for testing renewal",
              "validityPeriod": 30
            }
          }
        }
      }

services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      dynamodb:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c", "sleep 5 && aws dynamodb create-table --table-name nitrum-dev --attribute-definitions AttributeName=pk,AttributeType=S --key-schema AttributeName=pk,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb:8000 --region us-east-1"]
  
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/config/pebble-config.json"]
    ports:
      - "14000:14000"   # ACME directory  (https://localhost:14000/dir)
      - "15000:15000"   # management API
    configs:
      - source: pebble-config
        target: /config/pebble-config.json
    environment:
      PEBBLE_VA_NOSLEEP: "1"

  enclave:
    image: matzapata/nitrum-hello:dev
    pull_policy: never
    hostname: nitrum.local
    ports:
      - "443:443"     # HTTPS ingress
      - "5002:5002"   # ACME HTTP-01 (Pebble validates nitrum.local:5002; use 5002 when container runs non-root)
    networks:
      default:
        aliases:
          - nitrum.local   # so Pebble (ACME) can reach this service for HTTP-01
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      pebble:
        condition: service_started
    environment:
      RUST_LOG: info

      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      NITRUM_KMS_KEY_ID: local
      NITRUM_DYNAMODB_TABLE: nitrum-dev
      NITRUM_DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      NITRUM_ACME_HTTP01_LISTEN_ADDR: "0.0.0.0:5002"
      NITRUM_ACME_DIRECTORY_URL: https://pebble:14000/dir

      # ── crypto: local RSA key (required when using DynamoDB without KMS) ────
      # Generate once: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out kms_private.pem
