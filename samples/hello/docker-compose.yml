name: nitrum

services:
  control-plane:
    image: nitrum/control-plane:dev
    platform: linux/amd64
    container_name: nitrum-control-plane
    ports:
      - "8181:8181"
      - "443:443"
    networks:
      nitrum:
        # Static IP so the enclave can reach the control-plane by address,
        # not hostname. This mirrors VSock CID in a real enclave: no DNS needed
        # to reach the host side, avoiding the circular-resolver bootstrap problem.
        ipv4_address: 172.20.0.10
    environment:
      - RUST_LOG=info
      # Docker's embedded DNS — handles internal container names and forwards
      # unknown domains upstream. Available in every container at 127.0.0.11.
      - DNS_UPSTREAM=127.0.0.11:53
      # Set to 80 if tls_termination.enabled = false in the data-plane config.
      - INGRESS_PORT=443

  enclave:
    image: nitrum/hello:dev
    platform: linux/amd64
    container_name: nitrum-enclave
    depends_on:
      - control-plane
    cap_add:
      - NET_ADMIN
    networks:
      nitrum:
        ipv4_address: 172.20.0.11
    environment:
      - RUST_LOG=info
      - APP_PORT=8008

networks:
  nitrum:
    name: nitrum
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
