  NitroLaunchTemplateFCC44297:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: 32
              VolumeType: gp3
        EnclaveOptions:
          Enabled: true
        IamInstanceProfile:
          Arn:
            Fn::GetAtt:
              - NitroLaunchTemplateProfile74FD152A
              - Arn
        ImageId:
          Ref: SsmParameterValueawsserviceamiamazonlinuxlatestal2023amikernel61x8664C96584B6F00A464EAD1953AFF4B05118Parameter
        InstanceType: m6i.xlarge
        MetadataOptions:
          HttpTokens: required
          InstanceMetadataTags: enabled
        SecurityGroupIds:
          - Fn::GetAtt:
              - NitroInstanceSG51966EFB
              - GroupId
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: NitrumStack/NitroLaunchTemplate
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: NitrumStack/NitroLaunchTemplate
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                Content-Type: multipart/mixed; boundary="//"
                MIME-Version: 1.0

                --//
                Content-Type: text/cloud-config; charset="us-ascii"
                MIME-Version: 1.0
                Content-Transfer-Encoding: 7bit
                Content-Disposition: attachment; filename="cloud-config.txt"

                #cloud-config
                bootcmd:
                  - [ dnf, install, aws-nitro-enclaves-cli, aws-nitro-enclaves-cli-devel, htop, git, jq, -y ]

                --//
                Content-Type: text/x-shellscript; charset="us-ascii"
                MIME-Version: 1.0
                Content-Transfer-Encoding: 7bit
                Content-Disposition: attachment; filename="userdata.txt"

                #!/bin/bash

                exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

                set -x
                set +e

                usermod -aG docker ec2-user
                usermod -aG ne ec2-user

                # ── Nitro enclaves allocator ──────────────────────────────────────────────────
                ALLOCATOR_YAML=/etc/nitro_enclaves/allocator.yaml
                sed -r "s/^(\s*memory_mib\s*:\s*).*/\16144/" -i "$ALLOCATOR_YAML"
                sed -r "s/^(\s*cpu_count\s*:\s*).*/\12/" -i "$ALLOCATOR_YAML"

                # ── vsock-proxy allowlist ─────────────────────────────────────────────────────
                # ${__REGION__} is substituted by CloudFormation Fn::Sub before bash runs.
                cat > /etc/nitro_enclaves/vsock-proxy.yaml <<'VSOCK_EOF'
                allowlist:
                - {address: 169.254.169.254, port: 80}
                VSOCK_EOF

                systemctl enable --now docker
                systemctl enable --now nitro-enclaves-allocator.service
                systemctl enable --now nitro-enclaves-vsock-proxy.service

                # ── IMDS path for enclave: vsock 8002 → parent IMDS:80 (enclave viproxy default http://127.0.0.1:8099/latest) ──
                cat > /etc/systemd/system/enclave-imds-proxy.service <<'IMDS_PROXY_UNIT'
                [Unit]
                Description=Forward enclave vsock 8002 to EC2 IMDS (HTTP)
                After=nitro-enclaves-vsock-proxy.service

                [Service]
                Type=simple
                Restart=always
                RestartSec=2
                ExecStart=/bin/bash -ce 'exec /usr/bin/vsock-proxy 8002 169.254.169.254 80 --config /etc/nitro_enclaves/vsock-proxy.yaml -w 5'

                [Install]
                WantedBy=multi-user.target
                IMDS_PROXY_UNIT

                systemctl daemon-reload
                systemctl enable --now enclave-imds-proxy.service

                # ── Wait for services before pulling containers and downloading EIF ───────────
                sleep 5

                # ── Pull control-plane image and download enclave EIF from S3 ────────────────
                CONTROL_PLANE_IMAGE="matzapata/nitrum-control-plane:latest"
                EIF_ASSET_HASH="${__EIF_ASSET_HASH__}"

                docker pull "$CONTROL_PLANE_IMAGE"
                aws s3 cp "s3://${__EIF_S3_BUCKET__}/${__EIF_S3_KEY__}" /usr/bin/enclave.eif --region "${__REGION__}"
                echo "Deployed EIF asset hash: $EIF_ASSET_HASH"

                # ── Systemd unit for control-plane (gvproxy + enclave) ───────────────────────
                cat > /etc/systemd/system/control-plane.service <<'UNIT_EOF'
                [Unit]
                Description=Nitrum control-plane (gvproxy + enclave)
                After=docker.service nitro-enclaves-allocator.service
                Requires=docker.service

                [Service]
                Type=simple
                Restart=always
                RestartSec=10
                ExecStartPre=-/usr/bin/docker rm -f control-plane
                ExecStart=/usr/bin/docker run --rm --name control-plane \
                  --privileged \
                  --security-opt seccomp=unconfined \
                  -p 443:443 \
                  -p 9090:9090 \
                  -v /usr/bin/enclave.eif:/app/enclave.eif \
                  matzapata/nitrum-control-plane:latest /app/control-plane --debug-mode
                ExecStop=/usr/bin/docker stop -t 10 control-plane
                TimeoutStopSec=30

                [Install]
                WantedBy=multi-user.target
                UNIT_EOF

                systemctl daemon-reload
                systemctl enable --now control-plane.service

                --//--
              - __REGION__: sa-east-1
                __EIF_S3_BUCKET__: cdk-hnb659fds-assets-447655722442-sa-east-1
                __EIF_S3_KEY__: 7dfd8dcf283e06f3d173160ff22a98deb0aaa8c0217c7ab40a15e88aece8a020.eif
                __EIF_ASSET_HASH__: 7dfd8dcf283e06f3d173160ff22a98deb0aaa8c0217c7ab40a15e88aece8a020
