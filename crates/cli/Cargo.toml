[package]
name = "cli"
version = "0.1.0"
edition = "2024"
autobins = false
include = [
    "src/**/*",
    "../../infra/cloudformation/template.yml",
    "../../infra/docker/compose.yml",
    "../../samples/hello/Dockerfile",
    "../../samples/hello/package.json",
    "../../samples/hello/src/main.js",
]

[[bin]]
name = "nitrum"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
shared = { path = "../shared" }
clap = { version = "4", features = ["derive", "env"] }
bollard = "0.20.2"
bytes = "1"
colored = "2.1.0"
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
tar = "0.4"
dialoguer = "0.12.0"
indicatif = "0.17.0"
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-cloudformation = "1"
aws-sdk-ssm = "1"