[package]
name = "cli"
version = "0.1.0"
edition = "2024"
include = ["src/**/*", "../../samples/hello/template.yml"]

[lints]
workspace = true

[dependencies]
shared = { path = "../shared" }
clap = { version = "4", features = ["derive", "env"] }
bollard = "0.20.2"
bytes = "1"
colored = "2.1.0"
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
tar = "0.4"
dialoguer = "0.12.0"
indicatif = "0.17.0"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-cloudformation = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
] }