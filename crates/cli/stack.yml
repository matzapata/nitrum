# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,127}$'
    Description: >
      Project name used to determine CloudFormation stack name, DynamoDB table name, KMS alias,
      CloudWatch log group, tags, launch template, and SSM paths
      /nitrum/{ProjectName}/data-plane/… and /nitrum/{ProjectName}/env/….

  Retain:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      When true, retain KMS key, DynamoDB table, CloudWatch log groups, and SSM parameters on stack
      delete (typical production). When false (default), delete them with the stack (typical dev).

  EifS3Bucket:
    Type: String
    Description: >
      S3 bucket where the enclave EIF object was uploaded.

  EifS3Key:
    Type: String
    Default: enclave.eif
    Description: >
      S3 object key of the EIF file 

  EifVersionLabel:
    Type: String
    Default: "000000000000"
    Description: >
      Short label for this EIF build (e.g. first 12 hex chars of sha256). Change on every new
      upload so the launch template name changes and the Auto Scaling group can roll instances.

  AsgMinSize:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Auto Scaling group minimum size.

  AsgMaxSize:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Auto Scaling group maximum size (raise to scale out).

  AsgDesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Auto Scaling group desired capacity (must be between min and max).

  EnclaveCpuCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 8
    Description: >
      vCPUs per Nitro Enclave (nitro-cli --cpu-count). Must fit the EC2 instance type and match

  EnclaveMemoryMib:
    Type: Number
    Default: 4320
    MinValue: 64
    MaxValue: 61440
    Description: >
      Enclave memory in MiB (nitro-cli --memory). Must fit the instance and match allocator memory_mib.

  LatestAmazonLinux2023Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      Amazon Linux 2023 AMI id (resolved from SSM at deploy time).

  ControlPlaneImage:
    Type: String
    Default: ghcr.io/matzapata/nitrum/control-plane:latest
    Description: >
      Full Docker image reference for the Nitrum control-plane on EC2 (registry/repo:tag), e.g. from nitrum.toml control_plane.

  ControlPlaneDebugArg:
    Type: String
    Default: ""
    Description: Optional control-plane debug CLI arg (`--debug-mode` or empty).

  EifImageSha384:
    Type: String
    Description: >
      PCR0 / enclave image SHA-384 (hex, from `nitro-cli describe-eif`) used in the KMS key policy
      with kms:RecipientAttestation:ImageSha384 so attested Decrypt only succeeds for this EIF build.
      The deploy CLI sets this from the EIF unless overridden.

  KmsAdministratorRoleArn:
    Type: String
    Default: AWS_ACCOUNT_ROOT
    Description: >
      Principal allowed to administer this KMS key (Create*, Describe*, etc.). Use the default
      AWS_ACCOUNT_ROOT to allow the owning AWS account root ARN (typical). Otherwise pass a full IAM ARN.

  AlarmEmail:
    Type: String
    Default: ''
    Description: >
      Optional email for the enclave-down CloudWatch alarm (SNS subscription). Leave empty to create
      the alarm without notifications.

  AsgScalePolicy:
    Type: String
    Default: none
    AllowedValues: [none, cpu, ingress]
    Description: >
      Target-tracking autoscaling when max > min. none keeps static capacity from nitrum.toml.
      cpu tracks ASGAverageCPUUtilization on the ASG. ingress tracks Nitrum IngressRequests (sum).

  AsgScaleCpuTarget:
    Type: Number
    Default: 70
    MinValue: 20
    MaxValue: 90
    Description: Target average CPU percent when AsgScalePolicy is cpu.

  AsgScaleIngressTarget:
    Type: Number
    Default: 500
    MinValue: 1
    Description: >
      Target sum of IngressRequests per minute (Nitrum/${ProjectName}, Component=data-plane)
      when AsgScalePolicy is ingress.

# ─────────────────────────────────────────────────────────────────────────────
# Conditions
# ─────────────────────────────────────────────────────────────────────────────
Conditions:
  RetainData: !Equals [!Ref Retain, 'true']
  KmsAdminIsAccountRoot: !Equals [!Ref KmsAdministratorRoleArn, AWS_ACCOUNT_ROOT]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasMultipleReplicas: !Not [!Equals [!Ref AsgMaxSize, 1]]
  AsgCanScale: !Not [!Equals [!Ref AsgMinSize, !Ref AsgMaxSize]]
  ScaleOnCpu: !And
    - !Condition AsgCanScale
    - !Equals [!Ref AsgScalePolicy, cpu]
  ScaleOnIngress: !And
    - !Condition AsgCanScale
    - !Equals [!Ref AsgScalePolicy, ingress]

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── VPC ─────────────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} VPC"

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Public Subnet (AZ1)"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Public Subnet (AZ2)"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Private Subnet (AZ1)"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Private Subnet (AZ2)"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Internet Gateway"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} NAT EIP"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} NAT Gateway"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Public Routes"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Private Routes"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ── VPC Endpoints ────────────────────────────────────────────────────────────
  VpcEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName} VPC Endpoints"
      GroupDescription: !Sub "HTTPS from VPC CIDR to interface endpoints (${ProjectName})"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} VPC Endpoint SG"

  KMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref VpcEndpointSG]
      PrivateDnsEnabled: true

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref VpcEndpointSG]
      PrivateDnsEnabled: true

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroupIds: [!Ref VpcEndpointSG]
      PrivateDnsEnabled: true

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # ── Security Groups ──────────────────────────────────────────────────────────
  NitroNLBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName} NLB"
      GroupDescription: !Sub "Network Load Balancer - HTTP/HTTPS from internet, egress to targets (${ProjectName})"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet (IPv4, ACME HTTP-01)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: "::/0"
          Description: HTTP from internet (IPv6, ACME HTTP-01)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from internet (IPv4)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: "::/0"
          Description: HTTPS from internet (IPv6)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} NLB Security Group"

  NitroInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName} Nitro Instance"
      GroupDescription: !Sub "Nitro Enclave EC2 instances - HTTP/HTTPS, NLB, and VPC access (${ProjectName})"
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName} Instance Security Group"

  NitroSGIngressVpc:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 10.0.0.0/16
      Description: Allow HTTPS from within VPC

  NitroSGIngressNlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref NitroNLBSG
      Description: HTTPS from NLB (health checks + traffic)

  NitroSGIngressSelfHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref NitroInstanceSG
      Description: Intra-SG HTTPS

  NitroSGIngressSelfPing:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: icmp
      FromPort: 8
      ToPort: "-1"
      SourceSecurityGroupId: !Ref NitroInstanceSG
      Description: Intra-SG ping

  NitroSGIngressDirect:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS (optional direct / debugging)

  NitroSGIngressVpc80:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 10.0.0.0/16
      Description: HTTP from within VPC (ACME HTTP-01)

  NitroSGIngressNlb80:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref NitroNLBSG
      Description: HTTP from NLB (ACME HTTP-01)

  NitroSGIngressSelfHttp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref NitroInstanceSG
      Description: Intra-SG HTTP

  NitroSGIngressDirect80:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NitroInstanceSG
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: HTTP (optional direct / debugging, ACME)

  # ── KMS Key ──────────────────────────────────────────────────────────────────
  EnclaveKey:
    Type: AWS::KMS::Key
    DeletionPolicy: !If [RetainData, Retain, Delete]
    UpdateReplacePolicy: !If [RetainData, Retain, Delete]
    Properties:
      Description: !Sub "${ProjectName} | enclave CMK (GenerateDataKey + attested Decrypt)"
      EnableKeyRotation: !If [RetainData, true, false]
      # Enclave crypto: Principal is the account root so IAM (InstanceRole inline policy) controls
      # which identities may call KMS, without a CloudFormation cycle (role policy references this key ARN).
      # Decrypt is further restricted to attested calls matching this EIF's PCR0 (ImageSha384).
      # GenerateDataKey* is issued without Recipient today; see crates/data-plane crypto/kms.rs.
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableDecryptFromEnclave
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:Decrypt"
            Resource: "*"
            Condition:
              StringEqualsIgnoreCase:
                kms:RecipientAttestation:ImageSha384: !Ref EifImageSha384

          - Sid: EnclaveGenerateDataKey
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
            Resource: "*"

          - Sid: KmsAdministrator
            Effect: Allow
            Principal:
              AWS: !If
                - KmsAdminIsAccountRoot
                - !Sub "arn:aws:iam::${AWS::AccountId}:root"
                - !Ref KmsAdministratorRoleArn
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:Disable*"
              - "kms:Get*"
              - "kms:Delete*"
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:GenerateDataKey
              - kms:TagResource
              - kms:UntagResource
            Resource: "*"

  # Friendly alias for console, CLI, and docs (SSM still stores raw key id for the data-plane)
  EnclaveKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-enclave"
      TargetKeyId: !Ref EnclaveKey

  # ── DynamoDB Table ───────────────────────────────────────────────────────────
  EnclaveTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [RetainData, Retain, Delete]
    UpdateReplacePolicy: !If [RetainData, Retain, Delete]
    Properties:
      TableName: !Ref ProjectName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ── SSM Parameters ───────────────────────────────────────────────────────────
  NitrumKmsKeyParam:
    Type: AWS::SSM::Parameter
    DeletionPolicy: !If [RetainData, Retain, Delete]
    UpdateReplacePolicy: !If [RetainData, Retain, Delete]
    Properties:
      Name: !Sub "/nitrum/${ProjectName}/data-plane/kms_key_id"
      Type: String
      Value: !Ref EnclaveKey
      Description: !Sub "KMS key ID for Nitrum data-plane (${ProjectName})"

  NitrumDynamoTableParam:
    Type: AWS::SSM::Parameter
    DeletionPolicy: !If [RetainData, Retain, Delete]
    UpdateReplacePolicy: !If [RetainData, Retain, Delete]
    Properties:
      Name: !Sub "/nitrum/${ProjectName}/data-plane/dynamodb_table"
      Type: String
      Value: !Ref EnclaveTable
      Description: !Sub "DynamoDB table name for Nitrum data-plane (${ProjectName})"

  # ── CloudWatch Log Groups ────────────────────────────────────────────────────
  DataPlaneLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [RetainData, Retain, Delete]
    UpdateReplacePolicy: !If [RetainData, Retain, Delete]
    Properties:
      LogGroupName: !Sub "/nitrum/${ProjectName}/data-plane"
      RetentionInDays: 7

  ControlPlaneLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [RetainData, Retain, Delete]
    UpdateReplacePolicy: !If [RetainData, Retain, Delete]
    Properties:
      LogGroupName: !Sub "/nitrum/${ProjectName}/control-plane"
      RetentionInDays: 7

  # ── IAM (CloudFormation-generated physical names) ────────────────────────────
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: NitrumInstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEifFromS3
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${EifS3Bucket}/${EifS3Key}"

              - Sid: EnclaveKms
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:Decrypt
                Resource: !GetAtt EnclaveKey.Arn

              - Sid: DynamoReadWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt EnclaveTable.Arn

              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt DataPlaneLogGroup.Arn
                  - !Sub "${DataPlaneLogGroup.Arn}:*"
                  - !GetAtt ControlPlaneLogGroup.Arn
                  - !Sub "${ControlPlaneLogGroup.Arn}:*"

              - Sid: SsmParams
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nitrum/${ProjectName}/*"

              - Sid: SsmSecureStringKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ── Launch Template ───────────────────────────────────────────────────────────
  NitroLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${EifVersionLabel}"
      LaunchTemplateData:
        ImageId: !Ref LatestAmazonLinux2023Ami
        InstanceType: m6i.xlarge
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds: [!Ref NitroInstanceSG]
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          InstanceMetadataTags: enabled
        EnclaveOptions:
          Enabled: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 32
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: !If [RetainData, false, true]
        UserData:
          Fn::Base64:
            !Sub |
              Content-Type: multipart/mixed; boundary="//"
              MIME-Version: 1.0

              --//
              Content-Type: text/cloud-config; charset="us-ascii"
              MIME-Version: 1.0
              Content-Transfer-Encoding: 7bit
              Content-Disposition: attachment; filename="cloud-config.txt"

              #cloud-config
              bootcmd:
                - [ dnf, install, aws-nitro-enclaves-cli, aws-nitro-enclaves-cli-devel, htop, git, jq, -y ]

              --//
              Content-Type: text/x-shellscript; charset="us-ascii"
              MIME-Version: 1.0
              Content-Transfer-Encoding: 7bit
              Content-Disposition: attachment; filename="userdata.txt"

              #!/bin/bash

              exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

              set -x
              set +e

              usermod -aG docker ec2-user
              usermod -aG ne ec2-user

              # Nitro enclaves allocator (must align with EnclaveCpuCount / EnclaveMemoryMib)
              ALLOCATOR_YAML=/etc/nitro_enclaves/allocator.yaml
              sed -r "s/^(\s*memory_mib\s*:\s*).*/\1 ${EnclaveMemoryMib}/" -i "$ALLOCATOR_YAML"
              sed -r "s/^(\s*cpu_count\s*:\s*).*/\1 ${EnclaveCpuCount}/" -i "$ALLOCATOR_YAML"

              # Enable services
              systemctl enable --now docker
              systemctl enable --now nitro-enclaves-allocator.service
              systemctl enable --now nitro-enclaves-vsock-proxy.service

              sleep 5

              docker pull "${ControlPlaneImage}"

              IMDS_TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" || true)
              if [ -n "$IMDS_TOKEN" ]; then
                INSTANCE_ID=$(curl -sf -H "X-aws-ec2-metadata-token: ${IMDS_TOKEN}" http://169.254.169.254/latest/meta-data/instance-id || echo unknown)
              else
                INSTANCE_ID=$(curl -sf http://169.254.169.254/latest/meta-data/instance-id || echo unknown)
              fi

              cat > /etc/systemd/system/control-plane.service <<'UNIT_EOF'
              [Unit]
              Description=Nitrum control-plane (gvproxy + enclave)
              After=docker.service nitro-enclaves-allocator.service
              Requires=docker.service
              [Service]
              Type=simple
              Restart=always
              RestartSec=10
              ExecStartPre=-/usr/bin/docker rm -f control-plane
              ExecStart=/usr/bin/docker run --rm --name control-plane --privileged --security-opt seccomp=unconfined -e NITRUM_PROJECT_NAME=${ProjectName} -e NITRUM_INSTANCE_ID=__NITRUM_INSTANCE_ID__ -e NITRUM_LOG_FORMAT=json -e AWS_DEFAULT_REGION=${AWS::Region} -p 80:80 -p 443:443 ${ControlPlaneImage} /app/control-plane --eif-bucket ${EifS3Bucket} --eif-hash ${EifVersionLabel} --cpu-count ${EnclaveCpuCount} --memory-mib ${EnclaveMemoryMib} ${ControlPlaneDebugArg}
              ExecStop=/usr/bin/docker stop -t 10 control-plane
              TimeoutStopSec=30
              [Install]
              WantedBy=multi-user.target
              UNIT_EOF

              sed -i "s/__NITRUM_INSTANCE_ID__/${INSTANCE_ID}/g" /etc/systemd/system/control-plane.service

              systemctl daemon-reload
              systemctl enable --now control-plane.service

              --//--

  # ── Auto Scaling Group ───────────────────────────────────────────────────────
  NitroASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: NatGateway
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: 1
        MinInstancesInService: !If [HasMultipleReplicas, 1, 0]
        PauseTime: !If [HasMultipleReplicas, PT5M, PT0S]
        SuspendProcesses:
          - AlarmNotification
          - ScheduledActions
    Properties:
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgDesiredCapacity
      LaunchTemplate:
        LaunchTemplateId: !Ref NitroLaunchTemplate
        Version: !GetAtt NitroLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TargetGroupARNs: [!Ref NitroTargetGroup, !Ref NitroTargetGroupHttp]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Ref ProjectName
          PropagateAtLaunch: true

  NitrumCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: ScaleOnCpu
    Properties:
      AutoScalingGroupName: !Ref NitroASG
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref AsgScaleCpuTarget
        DisableScaleIn: false

  NitrumIngressScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: ScaleOnIngress
    Properties:
      AutoScalingGroupName: !Ref NitroASG
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        CustomizedMetricSpecification:
          Namespace: !Sub 'Nitrum/${ProjectName}'
          MetricName: IngressRequests
          Statistic: Sum
          Dimensions:
            - Name: Component
              Value: data-plane
        TargetValue: !Ref AsgScaleIngressTarget
        DisableScaleIn: false

  # ── Network Load Balancer ────────────────────────────────────────────────────
  NitroNLB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Type: network
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref NitroNLBSG]
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nlb"

  NitroTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      VpcId: !Ref VPC
      Protocol: TCP
      Port: 443
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckPort: "443"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-tg"

  # TCP 80 to instances for ACME HTTP-01. Health check uses 443 so targets stay healthy when ACME
  # is disabled (nothing may listen on enclave :80 in that case).
  NitroTargetGroupHttp:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      VpcId: !Ref VPC
      Protocol: TCP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckPort: "443"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-tg-http"

  NitroHTTPSListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref NitroNLB
      Protocol: TCP
      Port: 443
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NitroTargetGroup

  NitroHTTPListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref NitroNLB
      Protocol: TCP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NitroTargetGroupHttp

  # ── CloudWatch metrics dashboard and alarms (EMF from control/data-plane logs) ─
  MetricsAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub '${ProjectName}-nitrum-alarms'

  MetricsAlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref MetricsAlarmTopic

  EnclaveDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-enclave-down'
      AlarmDescription: >
        EnclaveRunning minimum across instances below 1 for five minutes (any replica unhealthy).
      Namespace: !Sub 'Nitrum/${ProjectName}'
      MetricName: EnclaveRunning
      Dimensions:
        - Name: Component
          Value: control-plane
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If
        - HasAlarmEmail
        - [!Ref MetricsAlarmTopic]
        - !Ref 'AWS::NoValue'

  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-ops'
      DashboardBody: !Sub
        - |
          {"widgets":[{"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Enclave running (per instance)","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":60,"metrics":[[{"expression":"SEARCH('{Nitrum/${ProjectName},Component,InstanceId} MetricName=\"EnclaveRunning\"', 'Average', 60)","label":"EnclaveRunning","id":"e1"}]],"yAxis":{"left":{"min":0,"max":1}}}},{"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Ingress requests (sum / 1m, all instances)","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":60,"stat":"Sum","metrics":[["Nitrum/${ProjectName}","IngressRequests","Component","data-plane",{"stat":"Sum"}]]}},{"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Ingress requests (per instance)","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":60,"metrics":[[{"expression":"SEARCH('{Nitrum/${ProjectName},Component,InstanceId} MetricName=\"IngressRequests\"', 'Sum', 60)","label":"IngressRequests","id":"i1"}]]}},{"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"ACME cert days remaining (minimum)","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":300,"stat":"Minimum","metrics":[["Nitrum/${ProjectName}","AcmeCertDaysRemaining","Component","data-plane",{"stat":"Minimum"}]]}},{"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Ingress 5xx (sum / 1m)","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":60,"stat":"Sum","metrics":[["Nitrum/${ProjectName}","Ingress5xx","Component","data-plane",{"stat":"Sum"}]]}},{"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"Leader lock held (per instance)","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":60,"metrics":[[{"expression":"SEARCH('{Nitrum/${ProjectName},Component,InstanceId,LockKey} MetricName=\"LeaderLockHeld\"', 'Maximum', 60)","label":"LeaderLockHeld","id":"l1"}]],"yAxis":{"left":{"min":0,"max":1}}}},{"type":"metric","x":0,"y":18,"width":8,"height":6,"properties":{"title":"App health check pass","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":60,"stat":"Average","metrics":[["Nitrum/${ProjectName}","AppHealthCheckPass","Component","data-plane",{"stat":"Average"}]],"yAxis":{"left":{"min":0,"max":1}}}},{"type":"metric","x":8,"y":18,"width":8,"height":6,"properties":{"title":"KMS / DynamoDB errors","view":"timeSeries","stacked":true,"region":"${AWS::Region}","period":60,"stat":"Sum","metrics":[["Nitrum/${ProjectName}","KmsErrors","Component","data-plane",{"stat":"Sum","label":"KmsErrors"}],[".","DynamoDbErrors",".",".",{"stat":"Sum","label":"DynamoDbErrors"}]]}},{"type":"metric","x":16,"y":18,"width":8,"height":6,"properties":{"title":"Enclave restarts (per instance)","view":"timeSeries","stacked":false,"region":"${AWS::Region}","period":300,"metrics":[[{"expression":"SEARCH('{Nitrum/${ProjectName},Component,InstanceId} MetricName=\"EnclaveRestartCount\"', 'Sum', 300)","label":"EnclaveRestartCount","id":"r1"}]]}}]}
        - ProjectName: !Ref ProjectName

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ProjectName:
    Description: Environment slug (DynamoDB table name, log group path segment, tags)
    Value: !Ref ProjectName

  NitrumSsmPrefix:
    Description: >
      Data-plane infra SSM path prefix (/nitrum/{ProjectName}/data-plane/).
    Value: !Sub "/nitrum/${ProjectName}/data-plane"

  NLBDnsName:
    Description: >
      Network Load Balancer DNS name (TCP 80 and 443 passthrough to the enclave via gvproxy).
    Value: !GetAtt NitroNLB.DNSName

  KmsKeyId:
    Description: KMS key ID
    Value: !Ref EnclaveKey

  KmsKeyAliasName:
    Description: KMS alias for operators (e.g. aws kms describe-key --key-id alias/...)
    Value: !Ref EnclaveKeyAlias

  DynamoTableName:
    Description: DynamoDB table name
    Value: !Ref EnclaveTable

  EC2InstanceRoleARN:
    Description: EC2 Instance Role ARN
    Value: !GetAtt InstanceRole.Arn

  ASGGroupName:
    Description: Auto Scaling Group name
    Value: !Ref NitroASG

  EifS3Uri:
    Description: S3 URI the control-plane uses to download the EIF at container startup
    Value: !Sub "s3://${EifS3Bucket}/${EifS3Key}"

  OpsDashboardName:
    Description: CloudWatch dashboard name (${ProjectName}-ops)
    Value: !Sub '${ProjectName}-ops'

  EnclaveDownAlarmName:
    Description: CloudWatch alarm when EnclaveRunning is below 1 for five minutes
    Value: !Ref EnclaveDownAlarm
