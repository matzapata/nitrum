AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Nitrum sample: Nitro Enclave on EC2 behind a Network Load Balancer (TCP 80 and 443), KMS, DynamoDB,
  SSM parameters under /nitrum/{ProjectName}/data-plane/ (KMS key id + DynamoDB table) and /nitrum/{ProjectName}/env/ (app secrets), plus VPC endpoints.
  ProjectName: stack name, DynamoDB table, KMS alias, log groups, tags, launch template, and SSM layout.
  Retain defaults false.
  Upload the EIF to S3; set EifVersionLabel when you publish a new EIF to refresh instances.
  The control-plane container downloads the EIF from S3 at startup (not EC2 user-data).
  Two AZs, single NAT, NLB security group and cross-zone load balancing enabled.

