# Local development compose for the enclaves.
#
# Usage:
#   docker compose up            # start (previously built hello image)
#   docker compose down          # stop
#
# For domain nitrum.local (e.g. ACME cert), add to your host /etc/hosts:
#   127.0.0.1 nitrum.local
# Then you can use: curl -sk https://nitrum.local/...
#
# Test the enclave well-known endpoints:
#   curl -sk https://nitrum.local/.well-known/enclave/status
#   curl -sk https://nitrum.local/.well-known/enclave/attestation
#
# Test the user app through TLS ingress:
#   curl -sk https://nitrum.local/health
#
# Access the internal data-plane API directly (no TLS):
#   curl http://nitrum.local/attestation -d '{}'
#
# Test crypto (encrypt/decrypt via app; plaintext is UTF-8 string):
#   curl -sk https://nitrum.local/crypto -H "Content-Type: application/json" -d '{"plaintext":"hello"}'
#
# Observability: the data-plane exports OTLP to the `observability` service (Grafana LGTM stack).
# Open Grafana at http://localhost:3000 to explore metrics, traces, and logs.
#
# Optional: create `.env.local` in the project root. On `nitrum local up`, each `KEY=value` is written to
# Floci (Compose service `aws`) SSM under `/nitrum/{nitrum.toml name}/env/KEY` (same layout as production).
# `nitrum local` rewrites `.nitrum/local-stack.yml` from the CLI template on each up/down/logs.

configs:
  pebble-config:
    content: |
      {
        "pebble": {
          "listenAddress": "0.0.0.0:14000",
          "managementListenAddress": "0.0.0.0:15000",
          "certificate": "test/certs/localhost/cert.pem",
          "privateKey": "test/certs/localhost/key.pem",
          "httpPort": 5002,
          "tlsPort": 5001,
          "ocspResponderURL": "",
          "externalAccountBindingRequired": false,
          "retryAfter": { "authz": 1, "order": 1 },
          "profiles": {
            "default": {
              "description": "Short-lived certs for testing renewal",
              "validityPeriod": 10
            }
          }
        }
      }

  aemm-config:
    content: |
      {
        "imdsv2": true,
        "server": {
          "hostname": "0.0.0.0",
          "port": "1338"
        },
        "metadata": {
          "paths": {
            "iam-security-credentials": "/latest/meta-data/iam/security-credentials/nitrum-local-role"
          },
          "values": {
            "iam-info": {
              "Code": "Success",
              "LastUpdated": "2024-01-01T00:00:00Z",
              "InstanceProfileArn": "arn:aws:iam::000000000000:instance-profile/nitrum-local-role",
              "InstanceProfileId": "AIPANITRUMLOCAL00"
            },
            "iam-security-credentials-role": "nitrum-local-role",
            "iam-security-credentials": {
              "Code": "Success",
              "LastUpdated": "2024-01-01T00:00:00Z",
              "Type": "AWS-HMAC",
              "AccessKeyId": "test",
              "SecretAccessKey": "test",
              "Token": "",
              "Expiration": "2099-01-01T00:00:00Z"
            }
          }
        }
      }

services:
  # Amazon EC2 Metadata Mock (IMDSv2 + fake instance profile credentials).
  imds:
    image: public.ecr.aws/aws-ec2/amazon-ec2-metadata-mock:v1.13.0
    platform: linux/amd64
    configs:
      - source: aemm-config
        target: /config/aemm-config.json
    command: ["-c", "/config/aemm-config.json"]
    ports:
      - "1338:1338"

  # Floci: AWS-compatible SSM + DynamoDB + KMS on 4566 (SSM params, table, symmetric DEK CMK).
  aws:
    image: floci/floci:1.5.5
    platform: linux/amd64
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - FLOCI_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      # Match upstream Floci image (Alpine: wget, not curl). JVM warm-up on emulated amd64 can exceed a short window.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4566/_floci/health"]
      interval: 10s
      timeout: 15s
      retries: 60
      start_period: 120s

  # One-shot: create DynamoDB table + SSM params expected by the data-plane (see crates/data-plane/src/bootstrap/ssm.rs).
  aws-init:
    image: amazon/aws-cli:latest
    platform: linux/amd64
    depends_on:
      aws:
        # Do not wait for Docker "healthy" — Floci/JVM startup can exceed healthcheck limits on slow or emulated CPUs.
        # The script below polls the DynamoDB API until the emulator responds.
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      # Project root (parent of `.nitrum/`); `.env.local` is read from here.
      - ..:/nitrum-project:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Floci (service aws) to accept AWS API calls..."
        ok=0
        for i in $$(seq 1 180); do
          if aws --endpoint-url=http://aws:4566 dynamodb list-tables >/dev/null 2>&1; then
            ok=1
            break
          fi
          sleep 1
        done
        if [ "$$ok" != 1 ]; then
          echo "Timed out after 180s — check: docker compose logs aws"
          exit 1
        fi
        
        PROJECT_NAME=dev
        if [ -f /nitrum-project/nitrum.toml ]; then
          parsed=$$(sed -n 's/^name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' /nitrum-project/nitrum.toml | head -1)
          if [ -n "$$parsed" ]; then
            PROJECT_NAME=$$parsed
          fi
        fi
        echo "nitrum.toml name: $$PROJECT_NAME (SSM paths match data-plane defaults)"
        DP_PREFIX="/nitrum/$$PROJECT_NAME/data-plane"
        ENV_PREFIX="/nitrum/$$PROJECT_NAME/env"
        
        aws --endpoint-url=http://aws:4566 dynamodb create-table \
          --table-name "$$PROJECT_NAME" \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
        
        KMS_KEY_ID=$$(aws --endpoint-url=http://aws:4566 kms create-key \
          --description nitrum-local-symmetric-data-key \
          --query KeyMetadata.KeyId --output text)
        
        aws --endpoint-url=http://aws:4566 ssm put-parameter \
          --name "$${DP_PREFIX}/kms_key_id" --value "$$KMS_KEY_ID" --type String --overwrite
        
        aws --endpoint-url=http://aws:4566 ssm put-parameter \
          --name "$${DP_PREFIX}/dynamodb_table" --value "$$PROJECT_NAME" --type String --overwrite
        
        if [ -f /nitrum-project/.env.local ]; then
          echo "Syncing .env.local to SSM (Floci) under $$ENV_PREFIX ..."
          HASH=$$(printf '\043')
          while IFS= read -r line || [ -n "$$line" ]; do
            line=$$(printf '%s' "$$line" | tr -d '\r')
            line=$$(printf '%s' "$$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$$//')
            case "$$line" in '') continue ;; esac
            first=$$(printf '%.1s' "$$line")
            [ "$$first" = "$$HASH" ] && continue
            key=$${line%%=*}
            val=$${line#*=}
            key=$$(printf '%s' "$$key" | sed 's/^export[[:space:]]\{1,\}//;s/^[[:space:]]*//;s/[[:space:]]*$$//')
            val=$$(printf '%s' "$$val" | sed 's/^[[:space:]]*//;s/[[:space:]]*$$//')
            if ! echo "$$key" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$$'; then
              echo "  skip invalid key: $$key"
              continue
            fi
            if aws --endpoint-url=http://aws:4566 ssm put-parameter \
              --name "$${ENV_PREFIX}/$$key" --value "$$val" --type SecureString --overwrite; then
              echo "  $$key"
            else
              echo "  warning: put-parameter failed for $$key"
            fi
          done < /nitrum-project/.env.local
        else
          echo "No .env.local (optional); skipping app env SSM seed."
        fi
        
        echo "aws-init (Floci seed) done."

  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    platform: linux/amd64
    command: ["-config", "/config/pebble-config.json"]
    ports:
      - "14000:14000"
      - "15000:15000"
    configs:
      - source: pebble-config
        target: /config/pebble-config.json
    environment:
      PEBBLE_VA_NOSLEEP: "1"

  # All-in-one Grafana observability backend (OpenTelemetry Collector + Prometheus +
  # Tempo + Loki + Grafana) for local dev. Mirrors the role the ADOT collector plays in
  # production (crates/cli/stack.yml): receives OTLP from the data-plane and renders it as
  # metrics, traces, and logs. Open the Grafana UI at http://localhost:3000 (anonymous,
  # admin) to explore dashboards.
  observability:
    image: grafana/otel-lgtm:latest
    platform: linux/amd64
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP/gRPC (data-plane export target)
      - "4318:4318" # OTLP/HTTP

  enclave:
    image: ${ENCLAVE_IMAGE}
    platform: linux/amd64
    pull_policy: never
    cap_add:
      - NET_ADMIN
    build:
      # Absolute paths set by `nitrum local` (`ENCLAVE_BUILD_CONTEXT` /
      # `ENCLAVE_DOCKERFILE`). In-repo samples use the workspace root so
      # Dockerfiles can `COPY crates/sdk`; standalone `nitrum init` projects
      # use the project directory + `Dockerfile`.
      context: ${ENCLAVE_BUILD_CONTEXT}
      dockerfile: ${ENCLAVE_DOCKERFILE}
      args:
        DATA_PLANE_IMAGE: ${DATA_PLANE_IMAGE}
    hostname: nitrum.local
    ports:
      - "443:443"
      - "5002:5002"
    networks:
      default:
        aliases:
          - nitrum.local
    depends_on:
      aws-init:
        condition: service_completed_successfully
      imds:
        condition: service_started
      pebble:
        condition: service_started
      observability:
        condition: service_started
    environment:
      RUST_LOG: info

      # Only for local dev
      NITRUM_IMDS_BASE_URL: http://imds:1338/latest
      # Export traces/metrics/logs over OTLP to the local Grafana stack (service `observability`).
      NITRUM_OTLP_ENDPOINT: http://observability:4317
      NITRUM_SSM_ENDPOINT_URL: http://aws:4566
      NITRUM_DYNAMODB_ENDPOINT_URL: http://aws:4566
      NITRUM_ACME_HTTP01_LISTEN_ADDR: "0.0.0.0:5002"
      NITRUM_ACME_DIRECTORY_URL: https://pebble:14000/dir
      NITRUM_KMS_ENDPOINT_URL: http://aws:4566
      PEBBLE_MINICA_CERT: |
        -----BEGIN CERTIFICATE-----
        MIIDPzCCAiegAwIBAgIIU0Xm9UFdQxUwDQYJKoZIhvcNAQELBQAwIDEeMBwGA1UE
