[package]
name = "data-plane"
version = "0.1.0"
edition = "2024"

[features]
enclave = ["shared/enclave", "dep:aws-nitro-enclaves-nsm-api", "dep:serde_bytes"]

[dependencies]
shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tokio-rustls = "0.26"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
axum = "0.8"
base64 = "0.22"
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true }
serde_bytes = { version = "0.11", optional = true }
