[package]
name = "config"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
enclave = ["dep:tokio-vsock"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", optional = true }
