[package]
name = "telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "telemetry"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
# http: axum HTTP request-metrics middleware. Off by default so consumers that
# only need logging/metrics/tracing do not pull in axum.
http = ["dep:axum"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.28"
tracing-opentelemetry = "0.29"
axum = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "rt-multi-thread"] }
