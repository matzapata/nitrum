[package]
name = "verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Verify AWS Nitro Enclave attestation documents"
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
ciborium = "0.2"
ecdsa = { version = "0.16", features = ["verifying"] }
hex = "0.4"
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
thiserror = "2"
x509-parser = "0.18"

[dev-dependencies]
base64 = "0.22"
hex-literal = "0.4"
sha2 = "0.10"
